<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Fonts: Bungee for display, Nunito for body -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="preload" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;500;600;700&display=swap&font-display=swap" as="style" />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;500;600;700&display=swap&font-display=swap" media="print" onload="this.media='all'" />
		<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;500;600;700&display=swap&font-display=swap" /></noscript>
		<meta property="og:image" content="https://franklyskanky.co.uk/frankly-logo.jpg" />
		<meta property="og:image:width" content="600" />
		<meta property="og:image:height" content="600" />
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:image" content="https://franklyskanky.co.uk/frankly-logo.jpg" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
