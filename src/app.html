<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Fonts: Tangerine for display, Open Sans for body -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="preload" href="https://fonts.googleapis.com/css2?family=Tangerine&family=Open+Sans:wght@400;500;600&display=swap" as="style" />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tangerine&family=Open+Sans:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
		<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tangerine&family=Open+Sans:wght@400;500;600&display=swap" /></noscript>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
